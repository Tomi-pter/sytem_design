syntax = "proto3";
package raftkv;

// ============================================================
// Internal node-to-node Raft protocol (gRPC).
// The client-facing API is separate — plain HTTP/JSON, per the
// hackathon's fixed contract (PUT/GET/DELETE /store/{key}, /health).
// ============================================================

service RaftInternal {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// A single replicated operation. This message doubles as the
// on-disk WAL record format (length-prefixed, appended to wal.log).
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string op = 3;        // "PUT" | "DELETE"
  string key = 4;
  string value = 5;      // empty for DELETE
}

// ---- Leader election ----

message VoteRequest {
  uint64 term = 1;
  string candidateId = 2;
  uint64 lastLogIndex = 3;
  uint64 lastLogTerm = 4;
}

message VoteResponse {
  uint64 term = 1;
  bool voteGranted = 2;
}

// ---- Log replication / heartbeat ----
// entries=[] on an AppendEntriesRequest = heartbeat only.

message AppendEntriesRequest {
  uint64 term = 1;
  string leaderId = 2;
  uint64 prevLogIndex = 3;
  uint64 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  uint64 leaderCommit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 matchIndex = 3;

  // Set only when success = false. Lets the leader jump nextIndex
  // back to the start of the conflicting term in one hop, instead
  // of decrementing and retrying index-by-index (fast recovery
  // catch-up for Stage 4).
  uint64 conflictTerm = 4;
  uint64 conflictIndex = 5;   // first index of conflictTerm in follower's log
}
