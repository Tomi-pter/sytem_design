version: "3.9"
services:
  node1:
    build: .
    environment:
      - NODE_ID=node-1
      - PUBLIC_PORT=8081
      - GRPC_PORT=50051
      - DATA_DIR=/data/node1
      - PEERS=node-2@localhost:50052:8082,node-3@localhost:50053:8083
    ports:
      - 8081:8081
      - 50051:50051
    volumes:
      - ./data/node1:/data/node1
  node2:
    build: .
    environment:
      - NODE_ID=node-2
      - PUBLIC_PORT=8082
      - GRPC_PORT=50052
      - DATA_DIR=/data/node2
      - PEERS=node-1@localhost:50051:8081,node-3@localhost:50053:8083
    ports:
      - 8082:8082
      - 50052:50052
    volumes:
      - ./data/node2:/data/node2
  node3:
    build: .
    environment:
      - NODE_ID=node-3
      - PUBLIC_PORT=8083
      - GRPC_PORT=50053
      - DATA_DIR=/data/node3
      - PEERS=node-1@localhost:50051:8081,node-2@localhost:50052:8082
    ports:
      - 8083:8083
      - 50053:50053
    volumes:
      - ./data/node3:/data/node3
